name: xsoc
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: sarmg <isarmg@163.com>
description: Read-only cross-platform host telemetry client for xsos
license: Apache-2.0
overrides:
  deb:
    # useradd/groupadd/userdel/groupdel are provided by passwd on Debian-family
    # systems; systemctl and the unit runtime come from systemd.
    depends:
      - passwd
      - systemd
      - util-linux
      - smartmontools
  rpm:
    # The same account tools use the shadow-utils package name on RPM-family
    # systems.
    depends:
      - shadow-utils
      - systemd
      - util-linux
      - smartmontools
# Run from the repository root:
#   cargo build --release -p xsoc
#   NFPM_ARCH=amd64 packaging/linux/build-packages.sh
# build-packages.sh reads the current version from Cargo and statically checks the fixed payload below
# against its ELF architecture, dedicated version section and xsoc.json.example before invoking nFPM.
# Do not execute foreign-architecture payloads or use CLIENT_BINARY/arbitrary VERSION to package a different input.
# Cargo workspace output is under root target/; all paths are repository-root relative.
#
# Do not use `${VAR}` in `contents[].src`; nFPM does not expand environment variables in that field.
# Artifact paths must be fixed workspace-relative paths that have passed static validation.
#
# Place cross-compiled artifacts in target/release/ before packaging, for example:
#   cargo build --release -p xsoc --target aarch64-unknown-linux-gnu
#   install -Dm755 target/aarch64-unknown-linux-gnu/release/xsoc target/release/xsoc
contents:
  - src: ./dist/native-payload/usr/bin/xsoc
    dst: /usr/bin/xsoc
    file_info:
      mode: 0755
  - src: ./dist/native-payload/etc/xsoc/config.json
    dst: /etc/xsoc/config.json
    type: config|noreplace
    file_info:
      mode: 0600
  - src: ./dist/native-payload/usr/lib/systemd/system/xsoc.service
    dst: /usr/lib/systemd/system/xsoc.service
  # GPU drop-in: default builds enable the nvidia feature, but PrivateDevices=yes hides
  # /dev/nvidia*, which NVML requires. This file must be bundled with the package; leaving it only
  # in the source tree leaves deb/rpm users unable to enable GPU collection.
  # postinstall explains how to enable it.
  - src: ./dist/native-payload/usr/share/xsoc/xsoc-gpu.conf
    dst: /usr/share/xsoc/xsoc-gpu.conf
  - src: ./dist/native-payload/usr/sbin/xsoc-purge
    dst: /usr/sbin/xsoc-purge
    file_info:
      mode: 0755
  - src: ./dist/native-payload/usr/share/doc/xsoc/runtime-sbom.cdx.json
    dst: /usr/share/doc/xsoc/runtime-sbom.cdx.json
    file_info:
      mode: 0644
  - src: ./dist/native-payload/usr/share/doc/xsoc/release-sbom.cdx.json
    dst: /usr/share/doc/xsoc/release-sbom.cdx.json
    file_info:
      mode: 0644
  - src: ./dist/native-payload/usr/share/doc/xsoc/THIRD_PARTY_RUNTIME_LICENSES.txt
    dst: /usr/share/doc/xsoc/THIRD_PARTY_RUNTIME_LICENSES.txt
    file_info:
      mode: 0644
scripts:
  postinstall: ./dist/native-payload/installer-scripts/postinstall.sh
  preremove: ./dist/native-payload/installer-scripts/preremove.sh
  postremove: ./dist/native-payload/installer-scripts/postremove.sh
